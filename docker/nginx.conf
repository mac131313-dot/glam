# Bez server_name ten blok obsługuje każdy Host – także własne domeny studiów (www.studio.pl).
# Host idzie do API bez zmian (proxy_set_header Host), a /api/public/domain rozpoznaje po nim studio.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Zdjęcia idą jako JSON z base64 – największy limit w API to 60 MB (filmy strony www).
  # Filmy lekcji (do 3 GB) idą kawałkami po 8 MB na /api/creator/uploads/.
  client_max_body_size 64m;

  # Kawałki filmów lecą prosto do API (bez buforowania całego body na dysku nginx).
  location /api/creator/uploads/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # Filmy lekcji strumieniem z Range – bez kopii w buforach nginx (pliki do kilku GB).
  location /api/stream/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Front to SPA (/panel, /app, /s/:slug) – nieznane ścieżki dostają index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
